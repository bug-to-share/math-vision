# @package actor_rollout_ref.actor.fsdp_config

# Additive group: reuse the exact primary DAPO YAML and override only the engine.
_target_: recipe.papo.config.PAPOFSDPEngineConfig

papo:
  _target_: recipe.papo.config.PAPOConfig
  enabled: true
  mask_probability: 0.6
  seed: 42
  perception_coef: 0.01
  clean_entropy_coef: 0.03
  masked_entropy_coef: 0.03
  gradient_mode: recompute_grad
  mask_strategy: random
  attention_temperature: 1.0
  attention_mix_alpha: 0.1
